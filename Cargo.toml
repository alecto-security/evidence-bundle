[package]
name = "evidence-bundle"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Verifier for sealed evidence bundles, including the notary proof (Alecto C1 schema v1)"
repository = "https://github.com/alecto-security/evidence-bundle"
publish = true

[[bin]]
name = "verify"
path = "src/main.rs"

[lib]
name = "evidence_bundle"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
walkdir = "2"
base64 = "0.22"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
